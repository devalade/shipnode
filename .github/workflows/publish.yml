name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor
      preid:
        description: 'Prerelease identifier, for the pre* bumps (alpha, beta, rc)'
        required: false
        type: string
        default: 'beta'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Bump version and tag
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "$BUMP" == pre* ]]; then
            VERSION=$(npm version "$BUMP" --preid "$PREID" --no-git-tag-version)
          else
            VERSION=$(npm version "$BUMP" --no-git-tag-version)
          fi

          # The npm dist-tag. A prerelease must never take `latest`: that is the
          # version every plain `npm install` resolves to, and pointing it at a
          # beta ships an unfinished release to everyone. 3.2.0-beta.0 publishes
          # under `beta`, and `latest` stays on the current stable line.
          if [[ "$VERSION" == *-* ]]; then
            SUFFIX="${VERSION#*-}"
            DIST_TAG="${SUFFIX%%.*}"
            PRERELEASE=true
          else
            DIST_TAG=latest
            PRERELEASE=false
          fi

          git add package.json
          git commit -m "Release ${VERSION}"
          git tag "${VERSION}"
          # The branch this run was dispatched from, not a hardcoded one: the
          # release line moves (v2, v3, …) and pushing the commit onto a branch
          # the release did not come from puts an untested bump on it.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${VERSION}"

          {
            echo "version=${VERSION}"
            echo "dist_tag=${DIST_TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --tag "${{ steps.version.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
